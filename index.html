<title>ITS-Academix AI</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f1730;--mut:#5b6787;--bd:#dfe4f0;--pri:#3b6cf6;--pur:#7c4dff;--grn:#0f9d72;--red:#e5484d;--amb:#c98500;--soft:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1a;--card:#121a2e;--tx:#e8ecf8;--mut:#93a0c0;--bd:#222e4d;--pri:#5b8cff;--pur:#a07bff;--grn:#2fd6a1;--red:#ff6b70;--amb:#f5b83d;--soft:#18233f}}
:root[data-theme="dark"]{--bg:#0a0e1a;--card:#121a2e;--tx:#e8ecf8;--mut:#93a0c0;--bd:#222e4d;--pri:#5b8cff;--pur:#a07bff;--grn:#2fd6a1;--red:#ff6b70;--amb:#f5b83d;--soft:#18233f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 6px}
header{padding:16px 16px 0;max-width:1040px;margin:auto}.brand{font-size:12px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
header h1{font-size:26px}header h1 b{color:var(--pur)}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:1040px;margin:auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{max-width:1040px;margin:auto;padding:4px 16px 40px}.sub{color:var(--mut);margin:0 0 14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.c h3{font-size:16px}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:9px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.don{width:130px;height:130px;display:block;margin:auto}.dn{font:700 24px Georgia,serif;fill:var(--tx)}.dl{font-size:9px;fill:var(--mut)}
.ins{background:var(--soft);border-radius:10px;padding:12px;margin-top:10px;font-size:14px;white-space:pre-wrap}.ins:empty{display:none}
.warn{background:color-mix(in srgb,var(--red) 12%,var(--card));border-color:var(--red)}
.btn{background:var(--pur);color:#fff;border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.btn.s{background:var(--soft);color:var(--tx);border:1px solid var(--bd);padding:6px 11px;font-size:13px;font-weight:500}
.chip{border:1px solid var(--bd);background:var(--soft);color:var(--tx);padding:6px 11px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer;margin:0 6px 6px 0}
.t{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.t:last-child{border:0}
.t.d .tt{text-decoration:line-through;opacity:.55}.t input{width:18px;height:18px;accent-color:var(--grn)}
.tm{width:66px;color:var(--mut);font-size:13px;flex:none}.tt{flex:1}.tt small{color:var(--mut);display:block}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.m.u{align-self:flex-end;background:var(--pri);color:#fff}.m.a{background:var(--soft)}
.in{display:flex;gap:8px;margin-top:10px}
.ti,select{padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;min-width:0;width:100%}.in .ti{flex:1}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}.f label{font-size:12px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--pri)}
.big{font:700 24px Georgia,serif}.up{color:var(--grn)}.dn2{color:var(--red)}
.res{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.res:last-child{border:0}
.sc{overflow-x:auto}svg text{font-family:system-ui,sans-serif}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.st div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}

.hin{max-width:760px;width:100%;margin:0 auto 8vh;animation:up .9s ease both}
#hero .brand{color:#c8d1ea}#hero h1{font-size:clamp(38px,9vw,68px);line-height:1.05;margin:8px 0 14px;color:#fff}#hero h1 b{color:#b9a4ff}
.mot{font:italic 500 clamp(20px,4.6vw,30px)/1.3 Georgia,serif;margin:0 0 10px}.hs{color:#c8d1ea;margin:0 0 26px}
.btn.go{padding:14px 28px;font-size:17px;border-radius:99px;background:linear-gradient(135deg,#5b8cff,#8b5cf6);box-shadow:0 8px 30px rgba(91,140,255,.4)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#home{max-width:1040px;margin:auto;padding:22px 16px 40px;animation:up .5s ease both}#home h2{font-size:30px;margin-top:14px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.cd{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s,border-color .15s;animation:up .5s ease both}
.cd:hover{transform:translateY(-3px);border-color:var(--pri)}.cd .n{font-size:11px;font-weight:700;color:var(--pur);letter-spacing:.1em}.cd .i{font-size:28px;display:block;margin:6px 0}.cd b{display:block;font:600 17px Georgia,serif}.cd .d{color:var(--mut);font-size:13px}
.bar2{max-width:1040px;margin:auto;padding:14px 16px 6px;display:flex;align-items:center;gap:12px}

/* ---- polish pass ---- */
:root{--ff:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:20px}
body{font-family:var(--ff);line-height:1.55;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--pur) 16%,transparent),transparent 60%),radial-gradient(760px 520px at -8% 22%,color-mix(in srgb,var(--pri) 13%,transparent),transparent 58%),var(--bg);background-attachment:fixed}
h1,h2,h3,.dn,.big,.cd b{font-family:var(--ff);letter-spacing:-.02em}svg text{font-family:var(--ff)}
h2{font-size:clamp(26px,5.4vw,36px);font-weight:800;line-height:1.15;margin:4px 0 8px;background:linear-gradient(90deg,var(--tx) 35%,var(--pur));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h3{font-size:17px;font-weight:700}.sub{font-size:15px;line-height:1.6;margin-bottom:20px}
main{padding:10px 16px 56px}.g{gap:16px}
.c{border-radius:var(--r);padding:20px;border-color:color-mix(in srgb,var(--bd) 85%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--soft)),var(--card));box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -18px rgba(10,20,60,.45)}
.k{font-weight:600;letter-spacing:.09em}
.btn{background:linear-gradient(135deg,var(--pri),var(--pur));border-radius:12px;padding:11px 18px;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--pur) 80%,transparent);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:none}
.btn.s{background:var(--soft);box-shadow:none;border-radius:99px;padding:8px 14px}.btn.s:hover{border-color:var(--pri)}
.chip{border-radius:99px;padding:8px 14px;transition:border-color .12s,transform .12s}.chip:hover{border-color:var(--pri);transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ti,select{border-radius:12px;padding:11px 14px;transition:border-color .12s,box-shadow .12s}

input[type=file]{width:100%;font-size:13px;color:var(--mut);border:1.5px dashed var(--bd);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--soft) 55%,transparent)}
input[type=file]::file-selector-button{margin-right:12px;padding:9px 16px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--pri),var(--pur));color:#fff;font:inherit;font-weight:600;cursor:pointer}
.f label{font-weight:600;display:block;margin-bottom:4px}
.bar{height:10px;background:color-mix(in srgb,var(--bd) 75%,transparent);margin:6px 0 14px}.bar i{position:relative;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bar i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35))}
@keyframes grow{from{width:0}}@keyframes draw{from{stroke-dasharray:0 289}}

.t{padding:13px 0}.t input{border-radius:6px}

[hidden]{display:none!important}

raw=await r.text()}catch(e){throw{code:e&&e.name=="AbortError"?"cancelled":"net",detail:e&&e.message?String(e.message).slice(0,80):""}}
let j={};try{j=JSON.parse(raw)}catch(e){}
if(!r.ok){const m=String((j.error&&(j.error.message||j.error))||"").slice(0,140);throw{code:r.status==429?"rate_limited":(r.status==401||r.status==403||(r.status==400&&/api key/i.test(m)))?"badkey":"api",detail:m||("HTTP "+r.status)}}

<div class="c"><h3>2 · Level</h3>${["Easy","Medium","Hard"].map(l=>`<button class="chip ${C.lvl==l?"on":""}" onclick="C.lvl='${l}';render()">${l}</button>`).join("")}<p class="sub" style="font-size:13px;margin:4px 0 0">${LD[C.lvl]}</p><h3 style="margin-top:16px">3 · Format</h3>${[["quiz","Quiz · 5 Qs · instant feedback"],["test","Test · 10 Qs · 10 min timer"]].map(m=>`<button class="chip ${C.mode==m[0]?"on":""}" onclick="C.mode='${m[0]}';render()">${m[1]}</button>`).join("")}<button class="btn" style="width:100%;margin-top:14px" onclick="startQ()">Start ${C.mode} →</button></div>
${mistCard()}${(D.quiz||[]).length?`<div class="c"><h3>Recent attempts</h3>${D.quiz.slice(0,5).map((x,i)=>`<div class="row res"><span>${x.d} · ${x.lvl} ${x.mode}</span><span><b>${x.s}/${x.n}</b> <button class="x" onclick="D.quiz.splice(${i},1);save();render()">×</button></span></div>`).join("")}</div>`:""}</div>`}
async function startQ(mist){const docs=C.src=="all"?D.docs:[D.docs[+C.src]].filter(Boolean);QE="";
if(!mist&&!docs.length&&!C.topic.trim()){QE="Upload a PDF, photo or notes first — or type a focus topic.";render();return}
QZ={st:"load"};render();const n=C.mode=="test"?10:5;let mat=mist?D.mist.slice(0,15).map(m=>"Q: "+m.q+"\nCorrect answer: "+m.c+"\nWhy: "+m.why).join("\n\n"):docs.map(d=>`[${d.n}]\n`+d.t).join("\n\n");
if(mat.length>24000){const P=[];for(let k=0;k<6;k++){const o=Math.floor(Math.random()*(mat.length-4000));P.push(mat.slice(o,o+4000))}mat=P.join("\n…\n")}
try{const r=await ai(`You are an expert exam-setter. Using ONLY the study material below (plus general subject knowledge for plausible wrong options), write ${n} multiple-choice questions at ${C.lvl} difficulty${C.topic.trim()?", focused on: "+C.topic.trim():""}.
${mist?"The student got these questions WRONG. Write NEW questions testing the same underlying concepts from different angles (new scenarios and wording), not the same questions.\n":""}RULES: never copy or lightly rephrase sentences from the material; never ask "what does the text say". Test real understanding by twisting: real-world scenarios, "what would happen if", spot-the-mistake, compare/contrast, odd-one-out, cause and effect, small numerical or code-trace twists where relevant. Mix question styles and jump between different sub-topics in random order (seed ${Math.random()}). This is a text-only app with no images — never write a question that needs a diagram, figure, graph or image to answer; if the material is diagram-heavy, ask about the concept or steps in words instead.
Easy = core concepts in fresh wording or simple scenarios. Medium = apply and compare, two-step thinking. Hard = multi-step reasoning, edge cases, combining concepts, very plausible wrong options. Never use LaTeX or $ math delimiters or commands like \\rightarrow — write plain Unicode symbols (→, ≤, ×) or words instead.
Exactly 4 short options per question, one correct, vary the correct position. "why" = one short plain-text sentence, no markdown symbols. "topic" = 2-3 word sub-topic.
Reply ONLY with JSON: {"questions":[{"q":"","opts":["","","",""],"a":0,"topic":"","why":""}]}

MATERIAL:
${mat||"(none — use the focus topic and general syllabus knowledge)"}`,{json:1});
const qs=(r.questions||[]).filter(x=>x.q&&Array.isArray(x.opts)&&x.opts.length>=3&&x.a>=0&&x.a<x.opts.length).slice(0,n).map(x=>{const o=x.opts.map((t,i)=>({t:String(t),c:i==x.a}));for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return{q:String(x.q),o,why:String(x.why||""),tp:String(x.topic||"General"),pick:null}});
if(qs.length<3)throw{code:"x"};QZ={st:"run",qs,i:0,mode:C.mode,lvl:C.lvl,left:600};
clearInterval(QT);if(C.mode=="test")QT=setInterval(()=>{if(!QZ||QZ.st!="run"){clearInterval(QT);return}QZ.left--;const e=$("qt");if(e)e.textContent=fmt(QZ.left);if(QZ.left<=0)finQ()},1000)
}catch(e){clearInterval(QT);QZ=null;QE=(e&&e.code&&e.code!="x")?why(e):"Couldn't build the quiz — please try again."}render()}
function runV(){const q=QZ.qs[QZ.i],last=QZ.i==QZ.qs.length-1,t=QZ.mode=="test",a=q.pick!=null;
return `<div class="row"><span class="k">${QZ.lvl} · ${t?"Test":"Quiz"} · Q ${QZ.i+1}/${QZ.qs.length}</span>${t?`<b id="qt">${fmt(QZ.left)}</b>`:""}</div>${bar(QZ.i/QZ.qs.length*100,"pur")}
<div class="c"><h3 style="font-size:18px;line-height:1.45">${ec(q.q)}</h3>${q.o.map((o,i)=>`<button class="opt${q.pick==i?" sel":""}${!t&&a?(o.c?" ok":q.pick==i?" no":""):""}" ${!t&&a?"disabled":""} onclick="pick(${i})"><b>${"ABCD"[i]}</b><span>${ec(o.t)}</span></button>`).join("")}
${!t&&a?`<div class="ins"><b>${q.o[q.pick].c?"Correct ✓":"Not quite"}</b><br>${md(q.why)}</div>`:""}
<div class="in" style="justify-content:space-between;margin-top:16px"><button class="btn s" onclick="quitQ()">Quit</button><button class="btn" ${a?"":"disabled"} onclick="${last?"finQ()":"nextQ()"}">${last?"Finish":"Next →"}</button></div></div>`}
function pick(i){const q=QZ.qs[QZ.i];if(QZ.mode=="quiz"&&q.pick!=null)return;q.pick=i;render()}
function nextQ(){QZ.i++;render();scrollTo(0,0)}
function quitQ(){clearInterval(QT);QZ=null;render()}
function finQ(){clearInterval(QT);const sc=QZ.qs.filter(q=>q.pick!=null&&q.o[q.pick].c).length;QZ.qs.forEach(q=>{const ok=q.pick!=null&&q.o[q.pick].c;if(ok){if(q.mk)D.mist=(D.mist||[]).filter(m=>m.q!=q.mk)}else if(!(D.mist||[]).some(m=>m.q==q.q))D.mist=[{q:q.q,c:q.o.find(o=>o.c).t,y:q.pick==null?"":q.o[q.pick].t,why:q.why,tp:q.tp,o:q.o.map(o=>o.t)},...(D.mist||[])].slice(0,100)});D.quiz=[{d:ld(new Date()),lvl:QZ.lvl,mode:QZ.mode,s:sc,n:QZ.qs.length},...(D.quiz||[])].slice(0,10);act();save();QZ.st="done";QZ.score=sc;render();scrollTo(0,0);if(sc/QZ.qs.length>=.6)confetti()}
function doneV(){const T=QZ.qs.length,p=Math.round(QZ.score/T*100),wr=[...new Set(QZ.qs.filter(q=>!(q.pick!=null&&q.o[q.pick].c)).map(q=>q.tp))];
return `<h2>${p>=80?"Excellent!":p>=50?"Good effort!":"Keep going!"}</h2><div class="g"><div class="c">${donut(p,col(p),QZ.score+"/"+T)}<p class="sub" style="text-align:center;margin:10px 0 0">${QZ.lvl} ${QZ.mode}</p></div><div class="c"><h3>Revise these topics</h3>${wr.length?wr.map(t=>`<button class="chip" onclick="C.topic='${esc(t).replace(/'/g,"")}';QZ=null;render()">${esc(t)}</button>`).join(""):`<p class="sub">Nothing — you got everything right 🎉</p>`}<div class="in"><button class="btn" onclick="startQ()">New ${QZ.lvl} set</button><button class="btn s" onclick="QZ=null;render()">Settings</button></div></div></div>
<div class="c" style="margin-top:16px"><h3>Review</h3>${QZ.qs.map((q,i)=>{const ok=q.pick!=null&&q.o[q.pick].c;return `<div class="res"><b>${ok?"✓":"✗"} Q${i+1}. ${ec(q.q)}</b><br><span class="sub" style="font-size:13px">Your answer: ${q.pick==null?"skipped":ec(q.o[q.pick].t)}${ok?"":" · Correct: "+ec(q.o.find(o=>o.c).t)}<br>${md(q.why)}</span></div>`}).join("")}</div>`}

/* ---- attendance ---- */
let AN=0;
function attBlock(n,a,t,T,sm){a=Math.min(a,t);const p=a/t*100,pn=a/(t+AN)*100,safe=p>=T,k=Math.floor(a*100/T-t+1e-9),x=Math.ceil((T*t-100*a)/(100-T)-1e-9);
const msg=safe?(k>0?`✅ Safe — you can miss <b>${k}</b> more class${k>1?"es":""}`:`⚠️ Right on the edge — don't miss the next class`):`❌ Attend the next <b>${x}</b> class${x>1?"es":""} in a row to reach ${T}%`;
return `${n?`<h3>${n}</h3>`:""}${sm?"":donut(Math.round(p),safe?"grn":"red","attendance")}<div class="row"><span>${a}/${t} classes</span><b class="${safe?"up":"dn2"}">${p.toFixed(1)}%</b></div>${bar(p,safe?"grn":"red")}<div style="font-size:14px">${msg}</div>${AN?`<div class="k" style="margin-top:6px">After missing ${AN}: ${pn.toFixed(1)}%</div>`:""}`}
function setAtt(i,k,v){const s=D.subs[i];s[k]=v===""?null:Math.max(0,+v);if(s.ca!=null&&s.ct>0)s.at=Math.round(Math.min(100,s.ca/s.ct*100));save();render()}
V.att=()=>{if(!D.subs.length)return `<h2>Attendance</h2>`+empty("Add subjects first, then enter classes attended and held.");
const T=D.attT||75,ok=D.subs.filter(s=>s.ca!=null&&s.ct>0),A=ok.reduce((a,s)=>a+Math.min(s.ca,s.ct),0),H=ok.reduce((a,s)=>a+s.ct,0);
return `<h2>Attendance</h2><p class="sub">Know exactly how many classes you can skip — or must attend — to stay above your target.</p>
<div class="g"><div class="c"><h3>Settings</h3><div class="f"><div><label>Target %</label><input class="ti" type="number" value="${T}" onchange="D.attT=Math.min(99,Math.max(1,+this.value||75));save();render()"></div><div><label>If I miss next N classes</label><div class="in" style="margin:0"><button class="btn s" onclick="AN=Math.max(0,AN-1);render()">−</button><b style="min-width:28px;text-align:center">${AN}</b><button class="btn s" onclick="AN=Math.min(30,AN+1);render()">+</button></div></div></div></div>
<div class="c">${H?attBlock("Overall",A,H,T):`<h3>Overall</h3><p class="sub">Enter classes for at least one subject below.</p>`}</div>
<div class="c" style="grid-column:1/-1"><h3>Subject-wise</h3>${D.subs.map((s,i)=>`<div class="res"><div class="row" style="align-items:center"><b>${esc(s.n)}</b><span class="in" style="margin:0"><input class="ti" style="width:92px" type="number" min="0" placeholder="Attended" value="${s.ca??""}" onchange="setAtt(${i},'ca',this.value)"><input class="ti" style="width:92px" type="number" min="0" placeholder="Held" value="${s.ct??""}" onchange="setAtt(${i},'ct',this.value)"></span></div>${s.ca!=null&&s.ct>0?attBlock("",s.ca,s.ct,T,1):`<span class="k">Enter classes attended and held</span>`}</div>`).join("")}</div></div>`};

let MEX=0;
function mistCard(){const M=D.mist||[];if(!M.length)return"";return `<div class="c"><h3>Mistake notebook (${M.length})</h3><p class="sub" style="font-size:13px">Questions you got wrong. Answer them correctly to clear them.</p>${[...new Set(M.map(m=>m.tp))].slice(0,6).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}<div class="in"><button class="btn" onclick="practiceM()">Practice mistakes</button><button class="btn s" onclick="startQ(1)">New twists</button></div><div class="in"><button class="btn s" onclick="MEX^=1;render()">${MEX?"Hide list":"Manage list"}</button><button class="btn s" onclick="D.mist=[];save();render()">Clear all</button></div>${MEX?M.map((m,i)=>`<div class="row res"><span style="font-size:13px">${esc(m.q.slice(0,70))}${m.q.length>70?"…":""}</span><button class="x" onclick="D.mist.splice(${i},1);save();render()">×</button></div>`).join(""):""}</div>`}
function practiceM(){const L=[...(D.mist||[])].sort(()=>Math.random()-.5).slice(0,5);if(!L.length)return;
const qs=L.map(m=>{const o=m.o.map(t=>({t,c:t==m.c}));for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return{q:m.q,o,why:m.why,tp:m.tp,pick:null,mk:m.q}});
QZ={st:"run",qs,i:0,mode:"quiz",lvl:"Mistakes",left:600};render();scrollTo(0,0)}

let FC=null;
function srcMat(){const docs=C.src=="all"?D.docs:[D.docs[+C.src]].filter(Boolean);let m=docs.map(d=>`[${d.n}]\n`+d.t).join("\n\n");if(m.length>24000){const P=[];for(let k=0;k<6;k++){const o=Math.floor(Math.random()*(m.length-4000));P.push(m.slice(o,o+4000))}m=P.join("\n…\n")}return m}
const noSrc=()=>{const m=srcMat();if(!m&&!C.topic.trim()){$("rst").textContent="Upload material or type a topic first.";return 1}$("rst").textContent="Working…"}

async function mkSheet(){if(noSrc())return;D.sheet={t:"Thinking…"};render();
try{const r=await ai(`Create a one-page last-night revision sheet${C.topic.trim()?" on: "+C.topic.trim():""} from the study material below. Sections: Key ideas (short bullets), Definitions & formulas, Common mistakes, Memory tricks, and 5 quick self-check questions (no answers). Use **bold** for key terms and markdown tables for any structured comparisons. Concise, under 350 words. Reword in simple language. If the material references a diagram or figure, summarise it in words or a table instead of drawing it.\n\nMATERIAL:\n${MT()}`,{onText:({text})=>{const e=$("sh");if(e)e.innerHTML=md(text)}});D.sheet={t:r.text.trim()};save();render()}catch(e){D.sheet=null;render();$("rst").textContent=why(e)||"Couldn't build it — try again."}}
async function mkCards(){if(noSrc())return;
try{const r=await ai(`Make 12 flashcards${C.topic.trim()?" on: "+C.topic.trim():""} from the study material below. Fronts must be reworded prompts or mini-scenarios (never copied lines); backs are short, exact answers. Cover different sub-topics in mixed order. Reply ONLY with JSON: {"cards":[{"f":"","b":""}]}\n\nMATERIAL:\n${MT()}`,{json:1});
const c=(r.cards||[]).filter(x=>x.f&&x.b).map(x=>({f:String(x.f),b:String(x.b)}));if(c.length<3)throw{code:"x"};FC={c,i:0,fl:0};render()}catch(e){$("rst").textContent=(e&&e.code&&e.code!="x")?why(e):"Couldn't build cards — try again."}}

async function testAI(){const c=fldCfg();if(!c.k){$("sst").textContent="Paste a key first.";return}$("sst").textContent="Testing…";
try{const r=await direct(c,"Reply with exactly the word OK.",{},new AbortController());$("sst").textContent="✅ Works! AI said: "+r.text.trim().slice(0,30)}catch(e){$("sst").textContent="❌ "+why(e)}}
